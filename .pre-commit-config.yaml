repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep rev in sync with ruff in uv.lock / pyproject.toml [dependency-groups].dev
    rev: v0.15.15
    hooks:
      - id: ruff
        name: ruff-lint
        args: ["--fix","--unsafe-fixes"]
        
      - id: ruff-format
        name: ruff-format