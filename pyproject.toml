[project]
name = "colt_ai"
version = "0.2.0"
description = "Colt-AI Data Ingestion and Crawling System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.34.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.2.1",
    "requests>=2.32.5",
    "python-dotenv>=1.0.1",
    "fastapi>=0.123.10",
    "python-multipart>=0.0.9",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-storage>=3.7.0",
    "uvicorn>=0.32.1",
    "pypdf>=6.7.3",
    "onnxruntime>=1.19.0",
    "transformers>=4.40.0",
    "markdown-pdf>=1.13.1",
    "opentelemetry-instrumentation-google-genai>=0.7b1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
    "opentelemetry-resourcedetector-gcp>=1.12.0a0",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-semantic-conventions>=0.62b1",
    "google-auth>=2.47.0",
    "pyjwt>=2.12.1",
    "google-cloud-aiplatform>=1.153.1",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "debugpy>=1.8.20",
]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "B", "UP", "SIM", "C4", "I"]
lint.ignore = ["E501"]
fix = true

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
