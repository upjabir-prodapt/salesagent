[project]
name = "colt_ai"
version = "0.2.0"
description = "Colt-AI Data Ingestion and Crawling System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.34.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.2.1",
    "requests>=2.32.5",
    "python-dotenv>=1.0.1",
    "fastapi>=0.123.10",
    "python-multipart>=0.0.9",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-storage>=3.7.0",
    "uvicorn>=0.32.1",
    "pypdf>=6.7.3",
    "onnxruntime>=1.19.0",
    "transformers>=4.40.0",
    "opentelemetry-instrumentation-google-genai>=0.7b1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
    "opentelemetry-resourcedetector-gcp>=1.12.0a0",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-semantic-conventions>=0.62b1",
    "google-auth>=2.47.0",
    "pyjwt>=2.12.1",
    "google-cloud-aiplatform>=1.153.1",
    "rank-bm25>=0.2.2",
    "markdown>=3.10.2",
    "weasyprint>=69.0",
    "pre-commit>=4.6.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "debugpy>=1.8.20",
]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "B", "UP", "SIM", "C4", "I"]
lint.ignore = ["E501"]
fix = true

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/services/research/agents/sales/prompts/*",
    "*/services/research/agents/adk/callbacks/*",
    "*/services/catalog/*",
    "*/services/research/agents/sales/tools/verification.py",
    "*/services/research/agents/sales/tools/embedding_similarity.py",
    "*/services/research/finalization/evaluation_section_a.py",
    "*/services/research/finalization/evaluation_section_b.py",
    "*/services/research/finalization/evaluation_service.py",
    "*/services/research/run/event_log.py",
    "*/services/research/run/runner.py",
    "*/services/research/run/progress.py",
    "*/repositories/catalog_job_repository.py",
]

[tool.coverage.report]
fail_under = 80
