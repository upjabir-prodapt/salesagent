# SonarQube Project Configuration
# To run: /home/jupyter/sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner

# Project identification
sonar.projectKey=sales-agent
sonar.projectName=Sales Agent
sonar.projectVersion=1.0

# Path to source code and tests
sonar.sources=src
sonar.tests=tests
sonar.language=py
sonar.python.version=3.11

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage report path
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**, **/.venv/**, **/tests/**
sonar.test.inclusions=**/tests/**

# Host and Auth (To be filled when server is available)
# sonar.host.url=YOUR_SONAR_URL
# sonar.login=YOUR_SONAR_TOKEN
